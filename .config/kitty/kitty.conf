# fonst
font_family      family='Monaspace Radon Var' style=Normal variable_name=MonaspaceRadonVar features='+ss01 +ss02 +ss03 +ss04 +ss05 +ss06 +ss07 +ss08 +ss09 +ss10 +calt +liga'
bold_font        family='Monaspace Radon Var' style=ExtraBold variable_name=MonaspaceRadonVar features='+ss01 +ss02 +ss03 +ss04 +ss05 +ss06 +ss07 +ss08 +ss09 +ss10 +calt +liga'
italic_font      auto
bold_italic_font auto

font_size 25.0

force_ltr off

# cursor
cursor_trail 1
cursor_trail_decay 0.1 0.2

# bell
enable_audio_bell yes
bell_on_tab "🔔 "

# window
remember_window_size  yes
active_border_color #B4BEFE
inactive_border_color #91CAFF
hide_window_decorations yes

# for scrollback nvim integration
allow_remote_control socket-only
listen_on unix:/tmp/kitty
shell_integration enabled
exe_search_path /run/current-system/sw/bin

# tabs
tab_bar_style slant
tab_bar_align right
tab_title_template "{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{tab.active_exe}"

# opacity
background_opacity 0.9
background_blur 67
dynamic_background_opacity no

# theme
include catppuccin.conf
# include tokyo_night.conf

# macos
macos_quit_when_last_window_closed no
macos_window_resizable yes
macos_thicken_font 0
macos_traditional_fullscreen off
macos_option_as_alt both

# key mapping
kitty_mod alt+super
map kitty_mod+k     scroll_line_up
map kitty_mod+j       scroll_line_down
map kitty_mod+b scroll_page_up
map kitty_mod+f scroll_page_down
map kitty_mod+g>g scroll_home
map kitty_mod+shift+g scroll_end
map kitty_mod+p scroll_to_prompt -1
map kitty_mod+n scroll_to_prompt 1
map kitty_mod+shift+h show_scrollback
map kitty_mod+w>s new_window
map cmd+n       new_os_window
map kitty_mod+w>q close_window
map cmd+w close_window
map kitty_mod+w>l next_window
map kitty_mod+w>h previous_window
map kitty_mod+w>shift+l move_window_forward
map kitty_mod+w>shift+h move_window_backward
map kitty_mod+l next_tab
map kitty_mod+h previous_tab
map kitty_mod+w>shift+q close_tab
map kitty_mod+g>x open_url_with_hints
map kitty_mod+g>f kitten hints --type path
# kitty-scrollback.nvim Kitten alias
action_alias kitty_scrollback_nvim kitten /Users/abdelkdous/.local/share/nvim/lazy/kitty-scrollback.nvim/python/kitty_scrollback_nvim.py

# Browse scrollback buffer in nvim
map kitty_mod+v kitty_scrollback_nvim
# Browse output of the last shell command in nvim
map kitty_mod+shift+v kitty_scrollback_nvim --config ksb_builtin_last_cmd_output
# Show clicked command output in nvim
mouse_map ctrl+shift+right press ungrabbed combine : mouse_select_command_output : kitty_scrollback_nvim --config ksb_builtin_last_visited_cmd_output
